<!DOCTYPE html>
<html>
<head>
    <title>Tesla Stock Price with Buy/Sell Signals</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        .controls {
            margin: 20px 0;
            text-align: center;
        }
        .btn {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn.active {
            background-color: #2196F3;
        }
        .js-plotly-plot .rangeslider {
            height: 30px !important;
            background: #f8f8f8 !important;
            border-top: 1px solid #ccc !important;
        }
        .js-plotly-plot .rangeslider .handle {
            background: #2196F3 !important;
            border-radius: 4px !important;
        }
        .js-plotly-plot .rangeslider .range-slider-handle {
            display: none !important;
        }
        .js-plotly-plot .rangeslider .range-slider-handle-left,
        .js-plotly-plot .rangeslider .range-slider-handle-right {
            display: none !important;
        }
        .js-plotly-plot .rangeslider .range-slider-handle:before,
        .js-plotly-plot .rangeslider .range-slider-handle:after {
            display: none !important;
        }
        /* 테이블 스타일 */
        .table-container {
            margin: 30px 20px;
            overflow-x: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-family: Arial, sans-serif;
        }
        .data-table th,
        .data-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .data-table th {
            background-color: #f2f2f2;
            font-weight: bold;
            color: #333;
        }
        .data-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .data-table tr:hover {
            background-color: #f5f5f5;
        }
        .buy-cell {
            color: #4CAF50;
            font-weight: bold;
        }
        .sell-cell {
            color: #f44336;
            font-weight: bold;
        }
        .year-filters {
            margin: 20px 0;
            text-align: center;
        }
        .year-btn {
            margin: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #2196F3;
            color: white;
            font-size: 12px;
        }
        .year-btn:hover {
            background-color: #1976D2;
        }
        .year-btn.active {
            background-color: #FF9800;
        }
        /* 워터마크 스타일 */
        .watermark {
            position: absolute;
            top: 70%;
            right: 5%;
            transform: rotate(0deg);
            font-size: 25px;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.08);
            z-index: 1000;
            pointer-events: none;
            user-select: none;
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .chart-container {
            position: relative;
        }
        .table-container {
            position: relative;
        }
        .table-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 80px;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.06);
            z-index: 100;
            pointer-events: none;
            user-select: none;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body style="position: relative;">
    <div class="controls">
        <button class="btn" onclick="zoomToPeriod('1M')">1개월</button>
        <button class="btn" onclick="zoomToPeriod('3M')">3개월</button>
        <button class="btn" onclick="zoomToPeriod('6M')">6개월</button>
        <button class="btn" onclick="zoomToPeriod('1Y')">1년</button>
        <button class="btn" onclick="resetZoom()">전체</button>

    <div class="chart-container">
        <div id="chart"></div>
        <div class="watermark">DAEBAK_100</div>

    <!-- 연도별 버튼과 테이블을 차트 아래로 이동 -->

                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        // 2) CSV 파싱
        const priceRows = Papa.parse(priceData, {header: true, skipEmptyLines: true}).data;
        const signalsRows = Papa.parse(signalsData, {header: true, skipEmptyLines: true}).data;
        // 3) 데이터 준비
        const priceDates = priceRows.map(row => row.Date);
        const priceValues = priceRows.map(row => parseFloat(row.stock_price));
        function parseShares(sharesStr) {
            return parseFloat(sharesStr.replace(/,/g, ''));
        }
        // 매수/매도 신호 데이터 준비
        const buySignals = [];
        const sellSignals = [];
        signalsRows.forEach(signal => {
            const priceRow = priceRows.find(price => price.Date === signal.Date);
            if (priceRow) {
                const shares = parseShares(signal.Shares);
                const price = parseFloat(priceRow.stock_price);
                const amount = Math.round(price * shares);
                const amountMillion = amount / 1_000_000;
                const dataPoint = {
                    x: signal.Date,
                    y: price,
                    shares: shares,
                    amount: amount,
                    text: `${signal.Direction}: ${signal.Shares} shares<br>Amount: $${amountMillion.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}M`
                };
                if (signal.Direction === 'Buy') {
                    buySignals.push(dataPoint);
                } else if (signal.Direction === 'Sell') {
                    sellSignals.push(dataPoint);
                }
            }
        });
        function calculateSize(shares) {
            const minSize = 8;
            const maxSize = 25;
            const minValue = 1000;
            const maxValue = 400000;
            const normalizedValue = Math.log(shares);
            const normalizedMin = Math.log(minValue);
            const normalizedMax = Math.log(maxValue);
            const size = minSize + (normalizedValue - normalizedMin) / (normalizedMax - normalizedMin) * (maxSize - minSize);
            return Math.max(minSize, Math.min(maxSize, size));
        }
        // 4) 차트 생성
        const traces = [
            {
                x: priceDates,
                y: priceValues,
                type: 'scatter',
                mode: 'lines',
                name: 'Price',
                line: {color: '#1f77b4', width: 2},
                xaxis: 'x',
                yaxis: 'y'
            },
            {
                x: priceDates,
                y: priceValues,
                type: 'scatter',
                mode: 'lines',
                line: {color: '#1f77b4', width: 2},
                xaxis: 'x',
                yaxis: 'y2',
                showlegend: false,
                hoverinfo: 'skip',
                visible: 'legendonly'
            },
            {
                x: buySignals.map(s => s.x),
                y: buySignals.map(s => s.y),
                type: 'scatter',
                mode: 'markers',
                name: 'Buy',
                text: buySignals.map(s => s.text),
                hoverinfo: 'text',
                marker: {
                    symbol: 'triangle-up',
                    size: buySignals.map(s => calculateSize(s.shares)),
                    color: 'green'
                },
                xaxis: 'x',
                yaxis: 'y'
            },
            {
                x: sellSignals.map(s => s.x),
                y: sellSignals.map(s => s.y),
                type: 'scatter',
                mode: 'markers',
                name: 'Sell',
                text: sellSignals.map(s => s.text),
                hoverinfo: 'text',
                marker: {
                    symbol: 'triangle-down',
                    size: sellSignals.map(s => calculateSize(s.shares)),
                    color: 'red'
                },
                xaxis: 'x',
                yaxis: 'y'
            }
        ];
        const layout = {
            title: 'Tesla Stock Price with ARK ETF Buy/Sell Signals',
            xaxis: {
                title: 'Date',
                showgrid: true,
                rangeslider: {
                    visible: true,
                    thickness: 0.1,
                    bgcolor: '#f8f8f8',
                    bordercolor: '#ccc',
                    borderwidth: 1,
                    yaxis: 'y2'
                },
                tickformat: '%Y-%m-%d'
            },
            yaxis: {
                title: 'Price (USD)',
                showgrid: true
            },
            yaxis2: {
                visible: false,
                overlaying: 'y',
                showgrid: false
            },
            hovermode: 'x unified',
            height: 800,
            autosize: true,
            dragmode: 'zoom',
            modebar: {
                orientation: 'v',
                bgcolor: 'rgba(255,255,255,0.7)',
                color: 'black',
                activecolor: '#ff7f0e'
            }
        };
        Plotly.newPlot('chart', traces, layout);
        // 기간별 줌 함수들
        window.zoomToPeriod = function(period) {
            const latestDate = new Date(priceDates[0]);
            let startDate;
            switch(period) {
                case '1M':
                    startDate = new Date(latestDate.getFullYear(), latestDate.getMonth() - 1, latestDate.getDate());
                    break;
                case '3M':
                    startDate = new Date(latestDate.getFullYear(), latestDate.getMonth() - 3, latestDate.getDate());
                    break;
                case '6M':
                    startDate = new Date(latestDate.getFullYear(), latestDate.getMonth() - 6, latestDate.getDate());
                    break;
                case '1Y':
                    startDate = new Date(latestDate.getFullYear() - 1, latestDate.getMonth(), latestDate.getDate());
                    break;
                case 'ALL':
                    startDate = new Date(priceDates[priceDates.length - 1]);
                    break;
            }
            const update = {
                'xaxis.range': [startDate.toISOString().split('T')[0], latestDate.toISOString().split('T')[0]]
            };
            Plotly.relayout('chart', update);
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            if (window.event) window.event.target.classList.add('active');
        }
        window.resetZoom = function() {
            Plotly.relayout('chart', {
                'xaxis.autorange': true,
                'yaxis.autorange': true
            });
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
        }
        document.getElementById('chart').on('plotly_relayout', function(eventData) {
            if (eventData['xaxis.range[0]'] || eventData['xaxis.range[1]']) {
                document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            }
        });
        // 연도별 필터링 함수
        window.filterByYear = function(year, evt) {
            document.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) evt.target.classList.add('active');
            // 테이블 내용 업데이트
            updateTable(year);
        }
        // 테이블 업데이트 함수
        function updateTable(selectedYear) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            const allSignals = [
                ...buySignals.map(signal => ({...signal, direction: 'Buy'})),
                ...sellSignals.map(signal => ({...signal, direction: 'Sell'}))
            ];
            allSignals.sort((a, b) => new Date(b.x) - new Date(a.x));
            const filteredSignals = selectedYear === 'all' 
                ? allSignals 
                : allSignals.filter(signal => signal.x.startsWith(selectedYear));
            filteredSignals.forEach(signal => {
                const row = document.createElement('tr');
                const dateCell = document.createElement('td');
                dateCell.textContent = signal.x;
                const priceCell = document.createElement('td');
                priceCell.textContent = `$${signal.y}`;
                const directionCell = document.createElement('td');
                directionCell.textContent = signal.direction;
                directionCell.className = signal.direction === 'Buy' ? 'buy-cell' : 'sell-cell';
                const sharesCell = document.createElement('td');
                sharesCell.textContent = signal.shares.toLocaleString();
                // 금액(USD) 계산
                const amount = Math.round(signal.y * signal.shares);
                const amountCell = document.createElement('td');
                const amountMillion = amount / 1_000_000;
                amountCell.textContent = amountMillion.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + 'M';
                row.appendChild(dateCell);
                row.appendChild(priceCell);
                row.appendChild(directionCell);
                row.appendChild(sharesCell);
                row.appendChild(amountCell);
                tableBody.appendChild(row);
            });
        }
        // 페이지 로드 시 전체 데이터로 테이블 초기화
        updateTable('all');
    });
